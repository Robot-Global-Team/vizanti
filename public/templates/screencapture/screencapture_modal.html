<div id="{uniqueID}_modal" class="modal_outer noselect">
	<div class="modal_inner noselect">
		<h3>Screen Capture</h3>
		<p id="{uniqueID}_status" class="status">Status: Connecting...</p>
		<hr>

		<p>Topic: <code>/screen_capture/compressed</code></p>
		<p>This widget always receives the local server's screen capture. Topic selection and all image settings are disabled.</p>

		<hr>

		<button id="{uniqueID}_remove" class="delete_button" onclick="removeWidget('{uniqueID}')">Remove Widget</button>
	</div>
</div>
